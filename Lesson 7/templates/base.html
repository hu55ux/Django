<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Knowledge Hub{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 24px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .nav-inner a {
            text-decoration: none;
            color: #374151;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-inner a:hover {
            background: #eaf2ff;
            color: #0b57d0;
        }

        h1 {
            color: #111827;
            margin-bottom: 20px;
        }

        p {
            margin: 10px 0;
        }

        a {
            color: #0b57d0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .muted {
            color: #6b7280;
            font-size: 0.95rem;
        }

        ul.notes {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        ul.notes li {
            background: #ffffff;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        ul.notes li:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.08);
        }

        ul.notes li > a {
            font-size: 1.05rem;
            font-weight: bold;
            margin-right: 8px;
        }

        form.note-form, form.filter-form {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            max-width: 650px;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        form input[type="text"],
        form select,
        form textarea {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #0b57d0;
            box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.12);
        }

        button, .btn {
            background: #0b57d0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover, .btn:hover {
            background: #0847ad;
            text-decoration: none;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            color: #111827;
        }

        .delete-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            border: 1px solid #fee2e2;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.08);
            max-width: 550px;
        }

        .delete-card h1 {
            color: #dc2626;
            font-size: 1.5rem;
            margin-top: 0;
        }

        .note-preview {
            background: #fcfcfd;
            border-left: 4px solid #dc2626;
            padding: 12px 16px;
            margin: 16px 0 24px;
            border-radius: 0 8px 8px 0;
        }

        .badge {
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-backend { color: #dc2626; background: #fef2f2; }
        .badge-database { color: #16a34a; background: #f0fdf4; }
        .badge-frontend { color: #2563eb; background: #eff6ff; }
        .badge-default { color: #4b5563; background: #f3f4f6; }
    </style>
</head>
<body>

{% include "notes/_page_header.html" %}

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
