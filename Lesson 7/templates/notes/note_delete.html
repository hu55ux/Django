{% extends "base.html" %}

{% block title %}Delete Note{% endblock %}

{% block content %}
    <div class="delete-card">
        <h1>Confirm Deletion</h1>
        <p>Are you sure you want to permanently delete this note?</p>

        <div class="note-preview">
            <strong>{{ note.title }}</strong>
            <p class="muted" style="margin: 4px 0 0 0;">Tag: {{ note.tag }} | Category: {{ note.category }}</p>
        </div>

        <form method="POST" action="{% url 'note_delete' note.id %}" style="padding:0; border:none; box-shadow:none; background:transparent;">
            {% csrf_token %}
            <div style="display: flex; gap: 12px; align-items: center;">
                <button type="submit" class="btn btn-danger">Yes, Delete Note</button>
                <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
