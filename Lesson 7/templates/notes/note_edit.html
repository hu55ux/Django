{% extends "base.html" %}

{% block title %}Edit Note{% endblock %}

{% block content %}
    <h1>Edit Note</h1>

    {% if err %}
        <p style="color:#dc2626; font-weight:600; margin-bottom:12px;">{{ err }}</p>
    {% endif %}

    <form method="POST" action="{% url 'note_edit' note.id %}" class="note-form">
        {% csrf_token %}

        <p>
            <label>Title *</label>
            <input type="text" name="title" value="{{ note.title }}" required>
        </p>

        <p>
            <label>Text</label>
            <textarea name="body" rows="6">{{ note.body }}</textarea>
        </p>

        <p>
            <label>Tag</label>
            <input type="text" name="tag" value="{{ note.tag }}">
        </p>

        <p>
            <label>Category</label>
            <input type="text" name="category" value="{{ note.category }}">
        </p>

        <div style="margin-top: 24px; display: flex; gap: 12px; align-items: center;">
            <button type="submit">Save Changes</button>
            <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
